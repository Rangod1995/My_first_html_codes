<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day11 Class work</title>
    <link rel="stylesheet" href="class_work.css">
    <style>
        .f {
            display: flex;
            background-color: aliceblue;
            height: 170px;
            width: 900px;
            justify-content: center;
            border-radius: 10px;
            margin-left: 10px;
            
             }

         .f div{
            background-color: aliceblue;
            color: black;
            margin: 10px;
            padding: 10px;
            text-align: center;
            font-size: 20px;
            border-style:groove;
            border: 2px groove;
            box-sizing: border-box;
            width: 120px;
            height: 120px;
            }


         .h {
            display: flex;
            background-color: aliceblue;
            height: 170px;
            width: 900px;
            justify-content: left;
            flex-wrap: wrap;
            align-items: center;
            border-radius: 10px;
            margin-left: 10px;
            
            
           }

           .h div {
            border-style: groove;
            width: 190px;
            height: 50px;
            box-sizing: border-box;
            font-size: 20px;
            border-radius: 10px;
            word-spacing: 5px;
            justify-content: center;
            align-self: center;
            padding: 5px;
           }
            
           
           

    
    </style>
</head>
<body>
<h1>🏬<span style="color: blue;">Flex</span><span>Store</span></h1>

<div class="a">
<h3>🛒Cart</h3>
</div>

<div>
    <button class="b">3 items</button>
</div>

<div>
    <button class="c">⚡Today's Deals<br>Use flexbox to arrange, align, and shrink&mdash;just like a real store layout.</button>
</div>

<div>
    <button class="d">Shop Now &#8594;</button>
</div>

<h3>📐 1. Align-self</h3>

<p class="e">Each Card Aligns Indivivdually</p>

<div class="f">
    <div style="align-self: top; border-color: blue;">🎧<br>Headphones<br>$49</div>
    <div style="align-self: center; border-color: aqua;">⌚<br>Smart Watch<br>$89</div>
    <div style="align-self: baseline; border-color: blueviolet;">📱<br>Phone Case<br>$19</div>
    <div style="align-self:center; border-color: brown;">💻<br>Laptop<br>$999</div>
    <div style="align-self: flex-end;">📷<br>Camera<br>$399</div>

</div><br><br>

<h3>📉2. Flex-Shrink</h3>

<p class="g">Resize window &#8594; red items shrinks 4x faster</p>

<div class="h">
    <div style="text-align: left;">🎧 Headphones <button class="i">x1</button></div>
    <div  style="text-align: left;">⌚ Watch <button class="j">x1</button></div>
    <div>📱 Case <button class="k">x1</button></div>
    <div style="border-color: red;background-color: rgba(255, 0, 0, 0.219); text-align: left;">💻Laptop⚡ <button class="l">x2</button></div>
    <div>📷Camera <button class="m">x1</button></div>


</div>

    
</body>
</html>
