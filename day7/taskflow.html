<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="taskflow.css"
    <title>Task Flow sign in page</title>
</head>
<body>
    
    <div>
        <h1 class="company_name">Taskflow</h1>
        <p class="cto">sign in to your account</p><br><br><br><br>

        <form class="login_form">
            <label class="email_label">Email or Username</label><br>
            <input class="email_input" type="text" placeholder="support@appBrew.com"><br><br>
            <label class="pass_label">Password</label><br>
            <input class="password_input" type="password"><br>
            <input class="remember_me_check" type="checkbox">Remember me

            <label class="otp_method_label">OTP Method</label>
            <select id="Otp method" name="choose Otp method">
                <option>Email</option>
                <option>SMS</option>
                <option>VoiceCall</option>

            </select><br><br>
            <button class="submit_btn">sign in</button>

        </form><br><br>
        <p class="demo_text">Demo Credentials: Support@appbrew.com or username/<br><span class="q_text">qwerty</span></p>


    </div>
    
</body>
</html>
