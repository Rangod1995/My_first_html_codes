<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:450px;
            background:#fff;
            padding:25px;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            margin-bottom:20px;
        }

        .input-area{
            display:flex;
            gap:10px;
        }

        input{
            flex:1;
            padding:10px;
            font-size:16px;
        }

        button{
            padding:10px 15px;
            cursor:pointer;
            border:none;
            border-radius:5px;
        }

        #addBtn{
            background:#007bff;
            color:white;
        }

        #stats{
            margin:20px 0;
            font-weight:bold;
            text-align:center;
        }

        ul{
            list-style:none;
        }

        li{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:12px;
            margin-bottom:10px;
            background:#f8f8f8;
            border-radius:6px;
        }

        .left{
            display:flex;
            align-items:center;
            gap:10px;
        }

        .completed{
            text-decoration:line-through;
            color:gray;
        }

        .status{
            font-size:13px;
            font-weight:bold;
        }

        .pending{
            color:#ff9800;
        }

        .done{
            color:green;
        }

        .delete{
            background:red;
            color:white;
        }

        .empty{
            text-align:center;
            color:gray;
            margin-top:20px;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>📝 My To-Do List</h1>

    <div class="input-area">
        <input
            type="text"
            id="taskInput"
            placeholder="Enter a task..."
        >
        <button id="addBtn">Add</button>
    </div>

    <p id="stats">Completed: 0 / 0</p>

    <ul id="taskList"></ul>

</div>

<script src="To-do-list.js"></script>

</body>
</html>
