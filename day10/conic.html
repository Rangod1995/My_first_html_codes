<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #conic1 {
            height: 150px;
            width: 200px;
            background-color: blueviolet;
            background-image: conic-gradient(cyan,skyblue, tomato, teal, pink ,gray, yellow, purple, aliceblue);
            border-radius: 50%;
        }

        #conic2 {
            height: 150px;
            width: 200px;
            background-color: blueviolet;
            background-image: repeating-conic-gradient(red 10%, yellow 35%);
            border-radius: 50%;
        }

        #conic3 {
            height: 200px;
            width: 200px;
            background-color: blueviolet;
            background-image: repeating-conic-gradient(red 0deg 10deg, yellow 0deg 35deg, blue 0deg 60deg);
            border-radius: 50%;
                                   
    </style>
</head>
<body>
    <h1>Conic- three colors</h1>

    <div id="conic1"></div>

    <div id="conic2"></div>

    <div id="conic3"></div>
    
</body>
</html>
